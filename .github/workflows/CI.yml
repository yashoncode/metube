name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}
      HAS_VT_KEY: ${{ secrets.VIRUS_TOTAL_API_KEY != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Update Version Name
        id: get_version
        run: |
          # Keep the original code to make the nightly and original builds interchangeable
          sed -i "s/versionName \"\(.*\)\"/versionName \"\1-nightly-${{ github.run_number }}\"/" smarttubetv/build.gradle
          echo "VERSION_NAME=$(grep "versionName" smarttubetv/build.gradle | head -n 1 | awk -F'"' '{print $2}')" >> $GITHUB_OUTPUT

      - name: Configure Build Signing
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=${{ github.workspace }}/key.jks" >> keystore.properties
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > ${{ github.workspace }}/key.jks
    
      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Lint with Gradle
        # continue-on-error：本倉 lint 有 420 條既存錯誤（實測 run 38023845805：
        # 第一條是 src/stmobile/.../GlassSource.java:36 用 RenderNode#setPosition，
        # 需要 API 29 而 flavor 的 minSdk 是 24）。這是 fork 自己的債，跟這次的繁中
        # 字符串無關，所以讓它報出來、上傳報告，但不擋後面產 APK 的步驟。
        continue-on-error: true
        run: ./gradlew lintStmobileRelease

      - name: Upload Lint Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: warn

      - name: Build with Gradle
        run: ./gradlew clean assembleStmobileRelease

      - name: Verify APK signatures (v1 + v2 + v3)
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          apksigner="$(ls "$sdk"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$apksigner" ]; then
            echo "::error::找不到 apksigner，簽名檢查無法進行"
            exit 1
          fi
          shopt -s nullglob
          apks=(./smarttubetv/build/outputs/apk/stmobile/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::沒有產出任何 APK"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            # --min-sdk-version 21 是強迫 apksigner 連 v1 一起驗：包的 minSdk 是 24 時不帶
            # 這個參數它會跳過 v1，把只簽 v2/v3 的包唸成合格。
            if ! out="$("$apksigner" verify -v --min-sdk-version 21 "$apk" 2>&1)"; then
              echo "::error::$apk 簽名不合格"
              echo "$out"
              exit 1
            fi
            for scheme in v1 v2 v3; do
              if ! grep -q "^Verified using ${scheme} scheme.*: true$" <<<"$out"; then
                echo "::error::$apk 缺少 ${scheme} 簽名"
                echo "$out"
                exit 1
              fi
            done
            echo "OK: $(basename "$apk") v1+v2+v3 都過"
          done

      - name: VirusTotal Scan
        if: ${{ env.HAS_VT_KEY == 'true' }}
        id: vt
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VIRUS_TOTAL_API_KEY }}
          files: |
            ./smarttubetv/build/outputs/apk/stmobile/release/*.apk
          request_rate: 4

      - name: VirusTotal Summary
        if: steps.vt.outcome == 'success'
        run: |
          echo "Waiting 150s for VirusTotal engines to report..."
          sleep 150

          echo "### Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact Name | VirusTotal Status | Detailed Report |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          for apk in ./smarttubetv/build/outputs/apk/stmobile/release/*.apk; do
            filename=$(basename "$apk")
            sha256=$(sha256sum "$apk" | awk '{print $1}')

            # Construct the dynamic badge URL using the hash
            badge_url="https://badges.cssnr.com/vt/id/$sha256?start=green&end=red&n=8"
            vt_link="https://www.virustotal.com/gui/file/$sha256"

            echo "| $filename | [![$filename]($badge_url)]($vt_link) | [View Report]($vt_link) |" >> $GITHUB_STEP_SUMMARY
          done

      # 檔名樣式按實測產物來：run 38025367615 印出的是
      # smarttubetv-stmobile-arm64-v8a-release.apk（上游那套 *_arm64-v8a.apk 對不上，
      # 會直接讓上傳步驟以 if-no-files-found: error 紅掉）。
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube_${{ steps.get_version.outputs.VERSION_NAME }}_arm64
          path: ./smarttubetv/build/outputs/apk/stmobile/release/*-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube_${{ steps.get_version.outputs.VERSION_NAME }}_armeabi-v7a
          path: ./smarttubetv/build/outputs/apk/stmobile/release/*-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Upload Universal APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube_${{ steps.get_version.outputs.VERSION_NAME }}_universal
          path: ./smarttubetv/build/outputs/apk/stmobile/release/*-universal-release.apk
          if-no-files-found: error

      - name: Upload x86 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube_${{ steps.get_version.outputs.VERSION_NAME }}_x86
          path: ./smarttubetv/build/outputs/apk/stmobile/release/*-x86-release.apk
          if-no-files-found: error
